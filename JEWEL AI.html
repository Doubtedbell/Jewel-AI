            height: 150px;
            position: absolute;
            top: 20px;
            transition: transform 0.3s ease;
        }

        .logo-left:hover, .logo-right:hover {
            transform: scale(1.1);
        }

        .logo-left {
            left: 15px;
            max-width: 90px;
            height: 120px;

            background-repeat: no-repeat;
            background-attachment: fixed;
            color: white;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 1000;
            margin: 0;
            padding: 0;
        }

        .welcome-screen::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;

            0% { transform: translateX(-100%) rotate(45deg); }

        }

        @keyframes wave {
            0% { transform: translateY(0); }
            50% { transform: translateY(10px); }
            100% { transform: translateY(0); }
        }
    </style>
</head>

        function startChat() {
            document.querySelector('.welcome-screen').style.display = 'none';
            document.querySelector('.chat-container').style.display = 'block';
            document.body.style.overflow = 'auto';
            addMessage("Hi! Here's a quick guide on how to search  specific classrooms! first state the grade, then dash with no space, then grade level, (if its a senior high, add another dash with no space, and the said strand), then space and put the sectio, easy right? ", 'ai');
            document.getElementById('userInput').focus(); // Add focus to input field
        }

        function sendMessage() {
            const input = document.getElementById('userInput');
            const message = input.value.trim();
            
            if (message) {
                addMessage(message, 'user');
                processMessage(message);
                input.value = '';
            }
        }

        function processMessage(message) {
            const normalizedMessage = message.trim().toLowerCase();
            
            // Keep existing grade patterns
            const gradePatterns = [
                /grade[- ]?(\d{1,2})/i,
                /^(7|8|9|10|11|12)$/,
                /gr\.?\s*(\d{1,2})/i,
                /search.*grade.*?(\d{1,2})/i,
                /find.*grade.*?(\d{1,2})/i,
                /show.*grade.*?(\d{1,2})/i,
                /where.*grade.*?(\d{1,2})/i,
                /Aha.*grade.*?(\d{1,2})/i,
                /Diin.*grade.*?(\d{1,2})/i
            ];
            
            let gradeMatch;
            for (const pattern of gradePatterns) {
                gradeMatch = normalizedMessage.match(pattern);
                if (gradeMatch) break;
            }

            let grade;
            if (gradeMatch) {
                grade = parseInt(gradeMatch[1]);
            }
            
            if (grade && grade >= 7 && grade <= 12) {
                updateTheme(grade);
                
                // More precise search for matching classroom
                const matchingClassroom = classrooms[grade].find(room => {
                    // Convert both strings to lowercase and remove spaces and dashes for comparison
                    const normalizedRoomName = room.name.toLowerCase().replace(/[-\s]/g, '');
                    const normalizedSearchTerm = normalizedMessage.replace(/[-\s]/g, '');
                    return normalizedSearchTerm.includes(normalizedRoomName);
                });

                if (matchingClassroom) {
                    // Updated formatting with better spacing and structure
                    const response = `
🎯 Found your classroom: ${matchingClassroom.name}!
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

📍 DETAILED DIRECTIONS:
${getDetailedDirections(matchingClassroom)}

⏰ BEST ROUTE:
${getBestRoute(matchingClassroom)}

🚶‍♂️ ESTIMATED WALKING TIME:
${getWalkingTime(matchingClassroom)}

${getClassroomTip(matchingClassroom)}
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

Need more help? Just ask! 😊
                    `;

                } else {

                    showGradeClassrooms(grade);

            }

                // Grade 7
                'Grade-7-Orchid': "Main Gate → Left Path → Ground Floor → Room 9",
                'Grade-7-Sunflower': "Main Gate → Left Path → Ground Floor → Room 15",
                'Grade-7-Gumamella': "Main Gate → Left Path → Ground Floor → Room 12",
                
                // Grade 8
                'Grade-8': "Main Gate → Building B → 1st Floor → Respective Room (201-203)",
                
                // Grade 9
                'Grade-9': "Main Gate → Building C → 2nd Floor → Respective Room (301-303)",
                
                // Grade 10
                'Grade-10-Integrity': "Main Gate → DepEd Building → 2nd Floor → Center Room",
                'Grade-10-Chastity': "Main Gate → DepEd Building → 3rd Floor → Second Left",
                'Grade-10-Courage': "Main Gate → DepEd Building → 2nd Floor → Second Right",
                
                // Grade 11
                'Grade-11-ICT A': "Main Gate → PAGCOR Building → 4th Floor → Center Room",
                'Grade-11-ICT B': "Main Gate → PAGCOR Building → 4th Floor → Second Left",
                'Grade-11-STE': "Main Gate → PAGCOR Building → 3rd Floor → First Right",
                
                // Grade 12
                'Grade-12-ICT TERABYTE': "Main Gate → PAGCOR Building → 4th Floor → First Left",
                'Grade-12-ICT MEGABYTE': "Main Gate → PAGCOR Building → 4th Floor → First Right",
                'Grade-12-STE GOLD': "Main Gate → PAGCOR Building → 3rd Floor → First Right",
            };
            return routes[classroom.name] || "Follow the standard building signs";
        }

        function getWalkingTime(classroom) {
            const times = {
                // Grade 7 (Ground Floor)
                'Grade-7-Orchid': "1-2 minutes",
                'Grade-7-Sunflower': "2-3 minutes",
                'Grade-7-Gumamella': "1-2 minutes",
                
                // Grade 8 (Building B)
                'Grade-8': "2-3 minutes",
                
                // Grade 9 (Building C)
                'Grade-9': "3-4 minutes",
                
                // Grade 10 (DepEd Building)
                'Grade-10-Integrity': "3-4 minutes",
                'Grade-10-Chastity': "4-5 minutes",
                'Grade-10-Courage': "3-4 minutes",
                
                // Grade 11 (PAGCOR)
                'Grade-11-ICT A': "4-5 minutes",
                'Grade-11-ICT B': "4-5 minutes",
                'Grade-11-STE': "3-4 minutes",
                
                // Grade 12 (PAGCOR)
                'Grade-12-ICT TERABYTE': "4-5 minutes",
                'Grade-12-ICT MEGABYTE': "4-5 minutes",
                'Grade-12-STE GOLD': "3-4 minutes",
                'Grade-12-OCA': "4-5 minutes"
            };
            return times[classroom.name] || "2-3 minutes";
        }

        function getClassroomTip(classroom) {
            const tips = {
                // Grade 7
                'Grade-7-Orchid': "Look for the Orchid flower signage next to the door.",
                'Grade-7-Sunflower': "The room has a bright yellow Sunflower sign.",
                'Grade-7-Gumamella': "Look for the Gumamella sign at the door.",
                
                // Grade 8
                'Grade-8': "Check the room numbers clearly displayed above each door.",
                
                // Grade 9
                'Grade-9': "Look for the large ***** series room numbers on the fourth floor.",
                
                // Grade 10
                'Grade-10-Integrity': "Located in the center of the 2nd floor, with 'Integrity' signage.",
                'Grade-10-Chastity': "Look for the blue door with 'Chastity' nameplate.",
                'Grade-10-Courage': "The room has a 'Courage' sign at the door.",
                
                // Grade 11
                'Grade-11-ICT A': "Look for the 'ICT-A' signage and computer lab symbol.",
                'Grade-11-ICT B': "Located near ICT TERABYTE, with 'ICT-B' marking.",
                'Grade-11-STE': "Room setup with 'STE' department sign.",
                
                // Grade 12
                'Grade-12-ICT TERABYTE': "The room has a 'TERABYTE' sign above the door. Computer lab is right on that floor.",
                'Grade-12-ICT MEGABYTE': "Look for the 'MEGABYTE' sign.",
                'Grade-12-STE GOLD': "Distinguished by the 'STE GOLD' nameplate and science symbols.",
                'Grade-12-OCA': "MADE BY JAPERT CABUGAO AND NINYO ESCOL"
            };
            return tips[classroom.name] || "Look for the room number and section name on the door";
        }

        function findClassroom(message, grade) {
            return classrooms[grade]?.find(room => 
                message.toLowerCase().includes(room.name.toLowerCase())
            );
        }

        function showClassroomInfo(classroom) {
            const response = `
                🎯 DING! DING! DING! WE FOUND YOUR CLASSROOM!!! FINALLY!!!:
                
                📍 ${classroom.name}
                📌 Location: ${classroom.location}
                
                Here's a visual guide to help you find it easily:
            `;
            addMessage(response, 'ai');
            addImage(classroom.image);
        }

        function showGradeClassrooms(grade) {
            const rooms = classrooms[grade];
            let response = `Here are all the Grade ${grade} classrooms that are possibly searchable!: 🏫\n\n`;
            rooms.forEach(room => {
                response += `📚 <strong>NAME:</strong> <strong>${room.name}</strong>\n`;
                response += `📍 <strong>LOCATION:</strong> <strong>${room.location}</strong>\n`;
                response += `━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n\n`;
            });
            addMessage(response, 'NAVI');
        }

        function showAllClassrooms() {
            let response = "Here's a complete list of all classrooms: 🏫\n\n";
            for (let grade in classrooms) {
                response += `🎓 Grade ${grade}:\n`;
                response += `━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n`;
                classrooms[grade].forEach(room => {
                    //Skip Grade 12 OCA
                    if (room.name !== "Grade-12-OCA")
                    response += `📚 <strong>NAME:</strong> <strong>${room.name}</strong>\n`;
                    response += `📍 <strong>LOCATION:</strong> <strong>${room.location}</strong>\n`;
                    response += `┈┈┈┈┈┈┈┈┈┈┈┈┈┈┈┈┈┈┈┈┈┈┈┈┈┈\n\n`;
                });
                response += `\n`;
            }
            addMessage(response, 'NAVI');
        }
        function updateTheme(grade) {
            const colors = {
                7: '#4CAF50',  // Green
                8: '#f44336',  // Red
                9: '#ffeb3b',  // Yellow
                10: '#ff9800', // Orange
                11: '#2196f3', // Blue
                12: '#9c27b0'  // Purple
            };
            document.body.style.backgroundColor = colors[grade] + '20';
        }

        function addMessage(text, sender) {
            const chatBox = document.getElementById('chatBox');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${sender}-message`;
            messageDiv.innerHTML = text;
            chatBox.appendChild(messageDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function addImage(src) {
            const chatBox = document.getElementById('chatBox');
            const imgDiv = document.createElement('div');
            imgDiv.className = 'message ai-message';
            const img = document.createElement('img');
            img.src = src;
            img.style.maxWidth = '100%';
            img.style.borderRadius = '10px';
            imgDiv.appendChild(img);
            chatBox.appendChild(imgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function resetChat() {
            const chatBox = document.getElementById('chatBox');
            chatBox.innerHTML = '';
            document.body.style.backgroundColor = '#f0f2f5';
            addMessage("How can I help you find your classroom? 😊", 'ai');
        }

        document.getElementById('userInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });
    </script>
</body>
</html>
